name: Build NebulaGram APK

on:
  workflow_dispatch:
  push:
    branches:
        - '**'

permissions: write-all

jobs:
  build:
    name: Build NebulaGram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          submodules: true
          
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30
          
      - uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install required dependencies
        run: |
          sudo apt install meson gperf
          
      - name: Remove prebuilt binaries 
        run: |
          find . -type f -wholename '*.a' -delete
          
      - name: Build Release APK
        run: |
          ./gradlew assembleAfatRelease
          
      - name: Rename APK
        run: |
          mv TMessagesProj_App/build/outputs/apk/afat/release/app-release-unsigned.apk app-release.apk || mv TMessagesProj_App/build/outputs/apk/afat/release/app.apk app-release.apk
          
      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: NebulaGram-Beta
          path: app-release.apk
